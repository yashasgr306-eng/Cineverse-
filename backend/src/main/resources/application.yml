server:
  port: 8080

spring:
  application:
    name: cineverse-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cineverse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

cineverse:
  jwt:
    secret: ${JWT_SECRET:Y2luZXZlcnNlLXN1cGVyLXNlY3JldC1rZXktMjAyNi1wcm9kdWN0aW9uLWp3dC0yNTYtYml0}
    expiration-ms: 86400000
  seat-lock:
    ttl-seconds: 300
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  firebase:
    api-key: ${FIREBASE_API_KEY:}
